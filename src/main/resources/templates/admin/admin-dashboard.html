<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SmashVN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar layout dùng chung -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('tongquan')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header layout dùng chung -->
            <div th:replace="~{admin/layout/header :: header}"></div>

            <!-- Quick Metrics -->
            <div class="row g-4 mb-5">
                <div class="col-md-6">
                    <div class="stat-card-premium d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-2 text-muted fw-bold" style="letter-spacing: 0.1em; font-size: 0.8rem;">Tài Khoản Thành Viên</h6>
                            <h2 class="mb-0 fw-extrabold fs-1 text-dark" th:text="${danhSachTaiKhoan.size()}">0</h2>
                        </div>
                        <div class="stat-icon-wrapper p-3 rounded-circle bg-light">
                            <i class="fas fa-users stat-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="stat-card-premium accent-slate d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-uppercase mb-2 text-muted fw-bold" style="letter-spacing: 0.1em; font-size: 0.8rem;">Sản Phẩm Trong Kho</h6>
                            <h2 class="mb-0 fw-extrabold fs-1 text-dark" th:text="${danhSachSanPham.size()}">0</h2>
                        </div>
                        <div class="stat-icon-wrapper p-3 rounded-circle bg-light">
                            <i class="fas fa-box-open stat-icon" style="color: #15171c;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Detailed Tables -->
            <div class="row g-4">
                <!-- Accounts Table -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                            <h5 class="fw-bold mb-0 text-white"><i class="fas fa-user-circle me-2 text-brand"></i>Danh Sách Tài Khoản</h5>
                            <span class="badge bg-primary" th:text="${danhSachTaiKhoan.size()} + ' users'"></span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive border-0 shadow-none">
                                <table class="table table-hover align-middle mb-0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Email</th>
                                            <th>Vai Trò</th>
                                            <th>Trạng Thái</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="tk : ${danhSachTaiKhoan}">
                                            <td th:text="${tk.id}"></td>
                                            <td class="fw-semibold text-secondary" th:text="${tk.email}"></td>
                                            <td>
                                                <span class="badge bg-dark text-white px-2.5 py-1.5" th:text="${tk.vaiTro}"></span>
                                            </td>
                                            <td>
                                                <span th:if="${tk.trangThai == 'hoat_dong'}" class="badge bg-success rounded-pill px-2.5 py-1.5">Hoạt động</span>
                                                <span th:unless="${tk.trangThai == 'hoat_dong'}" class="badge bg-danger rounded-pill px-2.5 py-1.5" th:text="${tk.trangThai}">Khóa</span>
                                            </td>
                                        </tr>
                                        <tr th:if="${danhSachTaiKhoan.isEmpty()}">
                                            <td colspan="4" class="text-center text-muted py-4">Không có tài khoản nào.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products Table -->
                <div class="col-lg-6">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                            <h5 class="fw-bold mb-0 text-white"><i class="fas fa-box me-2 text-brand"></i>Danh Sách Sản Phẩm (Gốc)</h5>
                            <span class="badge bg-primary" th:text="${danhSachSanPham.size()} + ' products'"></span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive border-0 shadow-none">
                                <table class="table table-hover align-middle mb-0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Tên Sản Phẩm</th>
                                            <th>Danh Mục</th>
                                            <th>Thương Hiệu</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="sp : ${danhSachSanPham}">
                                            <td th:text="${sp.id}"></td>
                                            <td class="fw-bold text-primary" th:text="${sp.tenSanPham}"></td>
                                            <td th:text="${sp.danhMuc.tenDanhMuc}"></td> 
                                            <td th:text="${sp.thuongHieu.tenThuongHieu}"></td>
                                        </tr>
                                        <tr th:if="${danhSachSanPham.isEmpty()}">
                                            <td colspan="4" class="text-center text-muted py-4">Không có sản phẩm nào.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
