<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Phân Loại - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar layout dùng chung -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('sanpham')}"></div>
        
        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header layout dùng chung -->
            <div th:replace="~{admin/layout/header :: header}"></div>
            
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center py-3">
                    <span class="text-white"><i class="fas fa-edit me-2 text-brand"></i>Sửa Phân Loại: <span th:text="${sp.tenSanPham}">Tên SP</span></span>
                    <a th:href="@{/admin/san-pham/{id}/bien-the(id=${sp.id})}" class="btn btn-sm btn-light">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                </div>
                <div class="card-body bg-white">
                    <div th:if="${param.loi != null}" class="alert alert-danger border-0 shadow-sm"><i class="fas fa-exclamation-triangle me-2"></i>Đã xảy ra lỗi khi cập nhật biến thể!</div>

                    <form th:action="@{/admin/san-pham/{idSP}/bien-the/sua/{idBT}(idSP=${sp.id}, idBT=${bt.id})}" method="post" enctype="multipart/form-data">
                        
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <label class="form-label">Giá bán (VNĐ) *</label>
                                <input type="number" name="giaBan" class="form-control" th:value="${bt.giaBan}" required min="1000" step="1000">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Số lượng kho *</label>
                                <input type="number" name="soLuongTon" class="form-control" th:value="${bt.soLuongTon}" required min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Hình ảnh sản phẩm (Để trống nếu giữ ảnh cũ)</label>
                                <input type="file" name="fileAnh" class="form-control" accept="image/*">
                                
                                <div class="mt-3 d-flex align-items-center" th:if="${bt.hinhAnhSanPham != null}">
                                    <small class="text-muted me-2">Ảnh hiện tại:</small>
                                    <img th:src="@{'/uploads/product/' + ${bt.hinhAnhSanPham}}" alt="Ảnh SP" 
                                         style="height: 60px; width: 60px; object-fit: cover; border-radius: 8px; border: 1.5px solid rgba(21,23,28,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Màu sắc *</label>
                                <input type="text" name="mauSac" class="form-control" th:value="${bt.mauSac}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Trọng lượng / Size *</label>
                                <input type="text" name="trongLuong" class="form-control" th:value="${bt.trongLuong}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Mức căng (Vợt)</label>
                                <input type="text" name="mucCang" class="form-control" th:value="${bt.mucCang}">
                            </div>
                        </div>

                        <div class="text-center mt-2">
                            <button type="submit" class="btn btn-warning px-5 fw-bold text-dark shadow-sm"><i class="fas fa-save me-2"></i> LƯU THAY ĐỔI</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
