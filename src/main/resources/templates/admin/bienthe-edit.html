<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Phân Loại - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar layout dùng chung -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('sanpham')}"></div>
        
        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header layout dùng chung -->
            <div th:replace="~{admin/layout/header :: header}"></div>
            
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between align-items-center py-3">
                    <span class="text-white"><i class="fas fa-edit me-2 text-brand"></i>Sửa Phân Loại: <span th:text="${sp.tenSanPham}">Tên SP</span></span>
                    <a th:href="@{/admin/san-pham/{id}/bien-the(id=${sp.id})}" class="btn btn-sm btn-light">
                        <i class="fas fa-arrow-left"></i> Quay lại
                    </a>
                </div>
                <div class="card-body bg-white">
                    <div th:if="${error != null}" class="alert alert-danger border-0 shadow-sm" th:text="${error}">Đã xảy ra lỗi!</div>

                    <form id="formSuaBienThe" th:action="@{/admin/san-pham/{idSP}/bien-the/sua/{idBT}(idSP=${sp.id}, idBT=${bt.id})}" method="post" enctype="multipart/form-data">
                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="row mb-4">
                            <div class="col-md-3">
                                <label class="form-label">Giá bán (VNĐ) *</label>
                                <input type="number" name="giaBan" class="form-control" th:value="${bt.giaBan}" required min="1" step="1000">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Số lượng kho *</label>
                                <input type="number" name="soLuongTon" class="form-control" th:value="${bt.soLuongTon}" required min="0">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Hình ảnh sản phẩm (Để trống nếu giữ ảnh cũ)</label>
                                <input type="file" name="fileAnh" id="fileAnh" class="form-control" accept="image/jpeg, image/png, image/webp">
                                <div id="fileError" class="text-danger mt-1" style="display: none;"></div>
                                
                                <div class="mt-3 d-flex align-items-center" th:if="${bt.hinhAnhSanPham != null}" id="currentImageArea">
                                    <small class="text-muted me-2">Ảnh hiện tại:</small>
                                    <img th:src="@{'/uploads/product/' + ${bt.hinhAnhSanPham}}" alt="Ảnh SP" 
                                         style="height: 60px; width: 60px; object-fit: cover; border-radius: 8px; border: 1.5px solid rgba(21,23,28,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                                </div>
                                <div id="imagePreviewContainer" class="mt-3" style="display: none;">
                                    <small class="text-muted d-block mb-1">Xem trước ảnh mới:</small>
                                    <img id="imagePreview" src="" alt="Preview image" style="height: 60px; width: 60px; object-fit: cover; border-radius: 8px; border: 1.5px solid rgba(21,23,28,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
                                </div>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Màu sắc *</label>
                                <input type="text" name="mauSac" class="form-control" th:value="${bt.mauSac}" required maxlength="50">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Trọng lượng / Size *</label>
                                <input type="text" name="trongLuong" class="form-control" th:value="${bt.trongLuong}" required maxlength="50">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Mức căng (Vợt)</label>
                                <input type="text" name="mucCang" class="form-control" th:value="${bt.mucCang}" maxlength="50">
                            </div>
                        </div>

                        <div class="text-center mt-2">
                            <button type="submit" class="btn btn-warning px-5 fw-bold text-dark shadow-sm"><i class="fas fa-save me-2"></i> LƯU THAY ĐỔI</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("formSuaBienThe");
    const fileInput = document.getElementById("fileAnh");
    const fileError = document.getElementById("fileError");
    const previewContainer = document.getElementById("imagePreviewContainer");
    const previewImg = document.getElementById("imagePreview");
    const currentImageArea = document.getElementById("currentImageArea");

    if (fileInput) {
        fileInput.addEventListener("change", function () {
            fileError.style.display = "none";
            fileError.textContent = "";
            previewContainer.style.display = "none";
            previewImg.src = "";

            const file = fileInput.files[0];
            if (!file) {
                if (currentImageArea) currentImageArea.style.display = "flex";
                return;
            }

            // 1. Kiểm tra định dạng (chỉ cho phép jpg, jpeg, png, webp)
            const allowedExtensions = ["jpg", "jpeg", "png", "webp"];
            const fileName = file.name.toLowerCase();
            const extension = fileName.substring(fileName.lastIndexOf(".") + 1);
            if (!allowedExtensions.includes(extension)) {
                fileError.textContent = "Định dạng tệp không hợp lệ! Chỉ cho phép JPG, JPEG, PNG, WEBP.";
                fileError.style.display = "block";
                fileInput.value = "";
                return;
            }

            // 2. Kiểm tra dung lượng (tối đa 5MB)
            const maxSize = 5 * 1024 * 1024; // 5MB
            if (file.size > maxSize) {
                fileError.textContent = "Kích thước hình ảnh quá lớn! Kích thước tối đa cho phép là 5MB.";
                fileError.style.display = "block";
                fileInput.value = "";
                return;
            }

            // 3. Hiển thị ảnh preview
            const reader = new FileReader();
            reader.onload = function (e) {
                previewImg.src = e.target.result;
                previewContainer.style.display = "block";
                if (currentImageArea) currentImageArea.style.display = "none";
            };
            reader.readAsDataURL(file);
        });
    }

    form.addEventListener("submit", function (e) {
        const giaBanInput = form.querySelector("input[name='giaBan']");
        const soLuongTonInput = form.querySelector("input[name='soLuongTon']");
        const mauSacInput = form.querySelector("input[name='mauSac']");
        const trongLuongInput = form.querySelector("input[name='trongLuong']");
        const mucCangInput = form.querySelector("input[name='mucCang']");

        if (giaBanInput && parseFloat(giaBanInput.value) <= 0) {
            alert("Giá bán phải lớn hơn 0!");
            e.preventDefault();
            return;
        }

        if (soLuongTonInput && parseInt(soLuongTonInput.value) < 0) {
            alert("Số lượng tồn kho phải lớn hơn hoặc bằng 0!");
            e.preventDefault();
            return;
        }

        if (mauSacInput && mauSacInput.value.trim().length > 50) {
            alert("Màu sắc không được vượt quá 50 ký tự!");
            e.preventDefault();
            return;
        }

        if (trongLuongInput && trongLuongInput.value.trim().length > 50) {
            alert("Trọng lượng / Size không được vượt quá 50 ký tự!");
            e.preventDefault();
            return;
        }

        if (mucCangInput && mucCangInput.value.trim().length > 50) {
            alert("Mức căng không được vượt quá 50 ký tự!");
            e.preventDefault();
            return;
        }
    });
});
</script>
</body>
</html>
