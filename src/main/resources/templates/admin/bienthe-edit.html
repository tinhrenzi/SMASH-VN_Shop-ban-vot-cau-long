<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Phân Loại - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        
        <!-- Sidebar layout dùng chung -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('sanpham')}"></div>
        
        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header layout dùng chung -->
            <div th:replace="~{admin/layout/header :: header}"></div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title">
                    <i class="fas fa-edit text-brand me-2"></i>Chỉnh Sửa Biến Thể
                </h2>
                <a th:href="@{/admin/san-pham/{id}/bien-the(id=${sp.id})}" class="btn btn-secondary shadow-sm">
                    <i class="fas fa-arrow-left me-1"></i> Quay lại Danh Sách Biến Thể
                </a>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-8">
                    <div class="card border-0 shadow-sm rounded-3">
                        <div class="card-header bg-dark text-white py-3 px-4 d-flex justify-content-between align-items-center rounded-top-3">
                            <div>
                                <i class="fas fa-box-open text-brand me-2"></i>
                                <span class="fw-bold text-white">Sản phẩm: <span class="text-warning" th:text="${sp.tenSanPham}">Tên SP</span></span>
                                <span class="badge bg-secondary ms-2" th:text="${sp.danhMuc.tenDanhMuc}">Danh mục</span>
                            </div>
                            <span class="badge bg-light text-dark fw-bold px-3 py-2 fs-6">Mã biến thể: #<span th:text="${bt.id}">1</span></span>
                        </div>
                        <div class="card-body p-4 bg-white">
                            <div th:if="${error != null}" class="alert alert-danger border-0 shadow-sm mb-4" th:text="${error}">Đã xảy ra lỗi!</div>

                            <form id="formSuaBienThe" th:action="@{/admin/san-pham/{idSP}/bien-the/sua/{idBT}(idSP=${sp.id}, idBT=${bt.id})}" method="post" enctype="multipart/form-data" onsubmit="return confirmSubmitForm(this, 'Bạn có chắc chắn muốn lưu thông tin cập nhật cho biến thể này không?');">
                                <!-- CSRF Token -->
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                                <!-- Section 1: Giá & Số lượng kho (Cân đối 2 cột 6 - 6) -->
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Giá bán (VNĐ) <span class="text-danger">*</span></label>
                                        <input type="number" name="giaBan" class="form-control" th:value="${bt.giaBan}" required min="1000" step="1000" placeholder="VD: 2500000">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Số lượng kho <span class="text-danger">*</span></label>
                                        <input type="number" name="soLuongTon" class="form-control" th:value="${bt.soLuongTon}" required min="0" placeholder="VD: 10">
                                    </div>
                                </div>

                                <!-- Section 2: Thuộc tính hiển thị linh hoạt tùy Danh mục -->
                                <!-- 2A. Dành cho Vợt (3 Thuộc tính: 4 - 4 - 4 = 12 cột) -->
                                <div class="row g-3 mb-4" th:if="${sp.danhMuc.id == categoryIds['VOT']}">
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Màu sắc <span class="text-danger">*</span></label>
                                        <input type="text" name="mauSac" class="form-control" th:value="${bt.mauSac}" required maxlength="50" placeholder="VD: Đỏ / Xanh / Đen">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Trọng lượng (Vợt) <span class="text-danger">*</span></label>
                                        <input type="text" name="trongLuong" class="form-control" th:value="${bt.trongLuong}" required maxlength="50" placeholder="VD: 3U / 4U / 5U">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-semibold">Sức căng khuyến nghị</label>
                                        <input type="text" name="mucCang" class="form-control" th:value="${bt.mucCang}" maxlength="50" placeholder="VD: 20 - 28 lbs">
                                    </div>
                                </div>

                                <!-- 2B. Dành cho Giày (2 Thuộc tính: 6 - 6 = 12 cột) -->
                                <div class="row g-3 mb-4" th:if="${sp.danhMuc.id == categoryIds['GIAY']}">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Màu sắc <span class="text-danger">*</span></label>
                                        <input type="text" name="mauSac" class="form-control" th:value="${bt.mauSac}" required maxlength="50" placeholder="VD: Trắng Xanh">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Size giày <span class="text-danger">*</span></label>
                                        <input type="text" name="kichThuoc" class="form-control" th:value="${bt.kichThuoc}" required maxlength="50" placeholder="VD: 36, 37... 46">
                                    </div>
                                </div>

                                <!-- 2C. Dành cho Trang Phục (2 Thuộc tính: 6 - 6 = 12 cột) -->
                                <div class="row g-3 mb-4" th:if="${sp.danhMuc.id == categoryIds['TRANG_PHUC']}">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Màu sắc <span class="text-danger">*</span></label>
                                        <input type="text" name="mauSac" class="form-control" th:value="${bt.mauSac}" required maxlength="50" placeholder="VD: Đen / Đỏ">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Size trang phục <span class="text-danger">*</span></label>
                                        <input type="text" name="kichThuoc" class="form-control" th:value="${bt.kichThuoc}" required maxlength="50" placeholder="VD: XS, S, M, L, XL...">
                                    </div>
                                </div>

                                <!-- 2D. Dành cho các danh mục khác ngoại trừ Hộp Cầu, Vợt, Giày, Trang Phục (1 Thuộc tính: 12 cột) -->
                                <div class="row g-3 mb-4" th:if="${sp.danhMuc.id != categoryIds['HOP_CAU'] and sp.danhMuc.id != categoryIds['VOT'] and sp.danhMuc.id != categoryIds['GIAY'] and sp.danhMuc.id != categoryIds['TRANG_PHUC']}">
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Màu sắc <span class="text-danger">*</span></label>
                                        <input type="text" name="mauSac" class="form-control" th:value="${bt.mauSac}" required maxlength="50" placeholder="VD: Tiêu chuẩn">
                                    </div>
                                </div>

                                <!-- 2E. Dành cho Hộp Cầu -->
                                <div class="row mb-4" th:if="${sp.danhMuc.id == categoryIds['HOP_CAU']}">
                                    <div class="col-12">
                                        <input type="hidden" name="mauSac" value="Mặc định">
                                        <div class="alert alert-info border-0 shadow-sm mb-0">
                                            <i class="fas fa-info-circle me-2"></i> Hộp cầu không sử dụng màu sắc hoặc kích thước. Bạn đang sửa thông tin giá bán và số lượng của biến thể mặc định này.
                                        </div>
                                    </div>
                                </div>

                                <!-- Section 3: Hình ảnh sản phẩm (Khu vực xem trước cân đối) -->
                                <div class="row mb-4">
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Hình ảnh biến thể (Để trống nếu giữ ảnh cũ)</label>
                                        <input type="file" name="fileAnh" id="fileAnh" class="form-control" accept="image/jpeg, image/png, image/webp">
                                        <div id="fileError" class="text-danger mt-1" style="display: none;"></div>

                                        <div class="mt-3 p-3 bg-light rounded-3 border d-flex align-items-center gap-4" th:if="${bt.hinhAnhSanPham != null}">
                                            <div th:if="${bt.hinhAnhSanPham != null}" id="currentImageArea" class="d-flex align-items-center gap-2">
                                                <small class="text-muted fw-semibold">Ảnh hiện tại:</small>
                                                <img th:src="@{'/uploads/product/' + ${bt.hinhAnhSanPham}}" alt="Ảnh SP" 
                                                     style="height: 70px; width: 70px; object-fit: contain; padding: 4px; background-color: #ffffff; border-radius: 8px; border: 1px solid #dee2e6; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                                            </div>
                                            <div id="imagePreviewContainer" style="display: none;" class="d-flex align-items-center gap-2">
                                                <small class="text-muted fw-semibold">Xem trước ảnh mới:</small>
                                                <img id="imagePreview" src="" alt="Preview image" 
                                                     style="height: 70px; width: 70px; object-fit: contain; padding: 4px; background-color: #ffffff; border-radius: 8px; border: 1px solid #dee2e6; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Action Buttons -->
                                <div class="d-flex justify-content-end gap-2 border-top pt-3 mt-4">
                                    <a th:href="@{/admin/san-pham/{id}/bien-the(id=${sp.id})}" class="btn btn-secondary px-4">
                                        <i class="fas fa-times me-1"></i> Hủy bỏ
                                    </a>
                                    <button type="submit" class="btn btn-warning fw-bold text-dark px-4 shadow-sm">
                                        <i class="fas fa-save me-1"></i> LƯU THAY ĐỔI
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const fileInput = document.getElementById("fileAnh");
    const fileError = document.getElementById("fileError");
    const previewContainer = document.getElementById("imagePreviewContainer");
    const previewImg = document.getElementById("imagePreview");
    const currentImageArea = document.getElementById("currentImageArea");

    if (fileInput) {
        fileInput.addEventListener("change", function () {
            fileError.style.display = "none";
            fileError.textContent = "";
            previewContainer.style.display = "none";
            previewImg.src = "";

            const file = fileInput.files[0];
            if (!file) {
                if (currentImageArea) currentImageArea.style.display = "flex";
                return;
            }

            const allowedExtensions = ["jpg", "jpeg", "png", "webp"];
            const fileName = file.name.toLowerCase();
            const extension = fileName.substring(fileName.lastIndexOf(".") + 1);
            if (!allowedExtensions.includes(extension)) {
                fileError.textContent = "Định dạng tệp không hợp lệ! Chỉ cho phép JPG, JPEG, PNG, WEBP.";
                fileError.style.display = "block";
                fileInput.value = "";
                return;
            }

            const maxSize = 5 * 1024 * 1024;
            if (file.size > maxSize) {
                fileError.textContent = "Kích thước hình ảnh quá lớn! Kích thước tối đa cho phép là 5MB.";
                fileError.style.display = "block";
                fileInput.value = "";
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                previewImg.src = e.target.result;
                previewContainer.style.display = "flex";
                if (currentImageArea) currentImageArea.style.display = "none";
            };
            reader.readAsDataURL(file);
        });
    }
});
</script>
</body>
</html>
