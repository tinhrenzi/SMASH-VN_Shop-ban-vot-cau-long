<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Bài Viết Mới - Admin SmashVN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
    
    <!-- Load local CKEditor -->
    <script th:src="@{/vendor/ckeditor/ckeditor.js}"></script>
    <script th:src="@{/vendor/ckeditor/translations/vi.js}"></script>
    
    <style>
        .ck-editor__editable_inline {
            min-height: 350px;
        }
        /* Style adjustments when inside iframe modal */
        body.iframe-mode {
            background-color: #ffffff !important;
            padding: 0 !important;
            margin: 0 !important;
        }
        body.iframe-mode .main-content {
            padding: 15px !important;
            margin: 0 !important;
            min-height: auto !important;
            background-color: #ffffff !important;
        }
        body.iframe-mode .card {
            box-shadow: none !important;
            border: none !important;
        }
    </style>
    <script>
        // Bulletproof client-side check to automatically hide sidebar & header when page is loaded inside an iframe
        if (window.self !== window.top) {
            document.documentElement.classList.add('iframe-mode');
            const style = document.createElement('style');
            style.innerHTML = `
                .sidebar, nav.sidebar, .admin-header {
                    display: none !important;
                }
                body, body.iframe-mode {
                    background-color: #ffffff !important;
                    padding: 0 !important;
                    margin: 0 !important;
                }
                main.main-content, .main-content {
                    margin-left: 0 !important;
                    width: 100% !important;
                    max-width: 100% !important;
                    flex: 0 0 100% !important;
                    padding: 15px !important;
                    min-height: auto !important;
                    background-color: #ffffff !important;
                }
                .card {
                    box-shadow: none !important;
                    border: none !important;
                }
                .btn-back-normal {
                    display: none !important;
                }
                .btn-close-iframe {
                    display: inline-block !important;
                }
            `;
            document.head.appendChild(style);
            document.addEventListener('DOMContentLoaded', function() {
                document.body.classList.add('iframe-mode');
                
                // Ensure form submissions preserve the iframe parameter
                const form = document.querySelector('form');
                if (form && form.action) {
                    if (!form.action.includes('iframe=')) {
                        form.action += (form.action.includes('?') ? '&' : '?') + 'iframe=true';
                    }
                }
            });
        }
    </script>
</head>
<body th:classappend="${param.iframe != null} ? 'iframe-mode' : ''">

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('blog')}" th:if="${param.iframe == null}"></div>

        <!-- Main Content -->
        <main th:class="${param.iframe != null} ? 'col-12 main-content' : 'col-md-10 main-content'">
            <!-- Header -->
            <div th:replace="~{admin/layout/header :: header}" th:if="${param.iframe == null}"></div>
            
            <!-- Alerts -->
            <div th:if="${loi != null}" class="alert alert-danger alert-dismissible fade show border-start border-danger border-4 rounded-3 shadow-sm mb-4" role="alert">
                <i class="fas fa-times-circle me-2"></i><span th:text="${loi}">Lỗi xử lý</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Add Form Card -->
            <div class="card border-0 shadow-sm mb-5">
               
                <div class="card-body p-4">
                    <form th:action="${param.iframe != null} ? @{/admin/blog/add(iframe=true)} : @{/admin/blog/add}" method="POST" enctype="multipart/form-data" id="addBlogForm">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div class="row g-4">
                            <!-- Title -->
                            <div class="col-md-8">
                                <label for="title" class="form-label fw-bold">Tiêu đề bài viết <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" th:field="${blog.title}" placeholder="Nhập tiêu đề hấp dẫn..." required>
                                <div class="invalid-feedback">Vui lòng điền tiêu đề bài viết.</div>
                            </div>
                            
                            <!-- Category -->
                            <div class="col-md-4">
                                <label for="category" class="form-label fw-bold">Danh mục bài viết <span class="text-danger">*</span></label>
                                <select class="form-select" id="category" th:field="${blog.category}" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option value="Hướng Dẫn">Hướng Dẫn</option>
                                    <option value="Review">Review Sản Phẩm</option>
                                    <option value="Kỹ Thuật">Kỹ Thuật Cầu Lông</option>
                                    <option value="Tin Tức">Tin Tức</option>
                                </select>
                            </div>

                            <!-- Author -->
                            <div class="col-md-6">
                                <label for="author" class="form-label fw-bold">Tác giả <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="author" th:field="${blog.author}" placeholder="Nhập tên tác giả hoặc tên hiển thị..." required>
                            </div>

                            <!-- Tags -->
                            <div class="col-md-6">
                                <label for="tagsInput" class="form-label fw-bold">Thẻ (Tags) <small class="text-muted">(phân tách bằng dấu phẩy)</small></label>
                                <input type="text" class="form-control" id="tagsInput" name="tags" placeholder="Yonex, Astrox, Hướng dẫn..." th:value="${blog.tags != null ? #strings.listJoin(blog.tags, ', ') : ''}">
                            </div>

                            <!-- Image Cover -->
                            <div class="col-md-8">
                                <label for="imageFile" class="form-label fw-bold">Hình ảnh bìa bài viết <span class="text-danger">*</span></label>
                                <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/jpeg,image/png,image/webp" required onchange="previewImage(event)">
                                <div class="form-text">Định dạng chấp nhận: JPG, JPEG, PNG, WEBP. Dung lượng tối đa: 5MB.</div>
                            </div>
                            
                            <!-- Image Preview Area -->
                            <div class="col-md-4 text-center">
                                <label class="form-label fw-bold d-block">Xem trước ảnh bìa</label>
                                <div class="border rounded p-2 d-inline-block bg-light" style="width: 100%; max-width: 200px; height: 130px; line-height: 110px; overflow: hidden;">
                                    <img id="imgPreview" src="" alt="" style="max-width: 100%; max-height: 100%; object-fit: cover; display: none;">
                                    <i id="imgPlaceholder" class="fas fa-image fa-3x text-muted" style="vertical-align: middle;"></i>
                                </div>
                            </div>

                            <!-- Summary -->
                            <div class="col-12">
                                <label for="summary" class="form-label fw-bold">Tóm tắt ngắn bài viết <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="summary" th:field="${blog.summary}" rows="3" placeholder="Nhập một đoạn tóm tắt ngắn thu hút người đọc trên danh sách tin tức..." required maxlength="900"></textarea>
                                <div class="form-text text-end" id="summaryCounter">0/900 ký tự</div>
                            </div>

                            <!-- Content (CKEditor) -->
                            <div class="col-12">
                                <label for="content" class="form-label fw-bold">Nội dung chi tiết bài viết <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="content" th:field="${blog.content}" placeholder="Viết nội dung bài viết ở đây..."></textarea>
                            </div>

                            <!-- Submit Action -->
                            <div class="col-12 border-top pt-4 text-end">
                                <button type="reset" class="btn btn-outline-secondary px-4 me-2">Nhập lại</button>
                                <button type="submit" class="btn btn-brand text-white px-5 shadow-sm"><i class="fas fa-save me-2"></i>Lưu Bản Nháp</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Initialize CKEditor 5
    let editorInstance;
    ClassicEditor
        .create(document.querySelector('#content'), {
            toolbar: [
                'heading', '|', 
                'bold', 'italic', 'link', 'bulletedList', 'numberedList', 'blockQuote', '|',
                'insertTable', 'mediaEmbed', 'codeBlock', '|',
                'undo', 'redo'
            ],
            language: 'vi'
        })
        .then(editor => {
            editorInstance = editor;
        })
        .catch(error => {
            console.error('Error initializing CKEditor:', error);
        });

    // Summary character counter with IME composition guards
    const summaryInput = document.getElementById('summary');
    const summaryCounter = document.getElementById('summaryCounter');
    let isComposing = false;

    function updateCounter() {
        const count = summaryInput.value.length;
        summaryCounter.textContent = `${count}/900 ký tự`;
    }

    summaryInput.addEventListener('compositionstart', () => {
        isComposing = true;
    });
    summaryInput.addEventListener('compositionend', () => {
        isComposing = false;
        updateCounter();
    });
    summaryInput.addEventListener('input', () => {
        if (!isComposing) {
            updateCounter();
        }
    });

    // Image preview
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const preview = document.getElementById('imgPreview');
            const placeholder = document.getElementById('imgPlaceholder');
            preview.src = reader.result;
            preview.style.display = 'inline-block';
            placeholder.style.display = 'none';
        }
        if(event.target.files[0]) {
            reader.readAsDataURL(event.target.files[0]);
        }
    }

    // Client-side validation on submit
    document.getElementById('addBlogForm').addEventListener('submit', function(event) {
        // Enforce CKEditor content sync and check
        if (editorInstance) {
            const editorData = editorInstance.getData();
            document.querySelector('#content').value = editorData;
            
            if (editorData.trim() === '') {
                alert('Nội dung bài viết không được để trống!');
                event.preventDefault();
                return false;
            }
        }
        
        const title = document.getElementById('title').value.trim();
        const category = document.getElementById('category').value;
        const author = document.getElementById('author').value.trim();
        const summary = document.getElementById('summary').value.trim();

        if (title === '' || category === '' || author === '' || summary === '') {
            alert('Vui lòng điền đầy đủ các thông tin bắt buộc (*)');
            event.preventDefault();
            return false;
        }

        // Image file size check (5MB limit)
        const fileInput = document.getElementById('imageFile');
        if (fileInput.files[0] && fileInput.files[0].size > 5 * 1024 * 1024) {
            alert('Kích thước ảnh bìa không được vượt quá 5MB!');
            event.preventDefault();
            return false;
        }
    });
</script>

</body>
</html>
