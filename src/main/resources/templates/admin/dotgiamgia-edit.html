<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh Sửa Đợt Giảm Giá - Admin SmashVN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
    <style>
        .product-list-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .search-box {
            position: relative;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        .search-box input {
            padding-left: 35px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar layout dùng chung -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('khuyenmai')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header layout dùng chung -->
            <div th:replace="~{admin/layout/header :: header}"></div>

            <!-- Page Title Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title">
                    <a th:href="@{/admin/khuyen-mai}" class="text-decoration-none text-brand me-1"><i class="fas fa-arrow-left"></i></a>
                    Chỉnh Sửa Đợt Giảm Giá
                </h2>
            </div>

            <!-- Alert Lỗi nếu có -->
            <div th:if="${loi != null}" class="alert alert-danger alert-dismissible fade show border-start border-danger border-4 rounded-3 shadow-sm mb-4" role="alert">
                <i class="fas fa-times-circle me-2"></i><span th:text="${loi}">Lỗi nhập liệu</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <div class="col-lg-10 mx-auto">
                    <div class="card border-0 shadow-sm mb-5">
                        <div class="card-header bg-dark text-white py-3">
                            <h5 class="fw-bold mb-0 text-white"><i class="fas fa-edit me-2 text-brand"></i>Cập Nhật Đợt Giảm Giá <span th:text="'#' + ${campaign.id}"></span></h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/khuyen-mai/dot-giam-gia/sua/{id}(id=${campaign.id})}" method="POST" id="campaignForm">
                                <div class="row g-4">
                                    <!-- Tên chiến dịch -->
                                    <div class="col-md-6">
                                        <label for="tenChienDich" class="form-label fw-bold">Tên Chiến Dịch <span class="text-danger">*</span></label>
                                        <input type="text" id="tenChienDich" name="tenChienDich" th:value="${campaign.tenChienDich}" class="form-control" required>
                                    </div>

                                    <!-- Phần trăm giảm -->
                                    <div class="col-md-3">
                                        <label for="phanTramGiam" class="form-label fw-bold">Phần Trăm Giảm (%) <span class="text-danger">*</span></label>
                                        <input type="number" id="phanTramGiam" name="phanTramGiam" th:value="${campaign.phanTramGiam}" class="form-control" min="1" max="100" required>
                                    </div>

                                    <!-- Loại giảm giá -->
                                    <div class="col-md-3">
                                        <label for="loaiGiamGia" class="form-label fw-bold">Loại Giảm Giá <span class="text-danger">*</span></label>
                                        <select id="loaiGiamGia" name="loaiGiamGia" class="form-select" required>
                                            <option value="Theo Phần Trăm" th:selected="${campaign.loaiGiamGia == 'Theo Phần Trăm'}">Theo Phần Trăm</option>
                                            <option value="Theo Khoảng" th:selected="${campaign.loaiGiamGia == 'Theo Khoảng'}">Theo Khoảng</option>
                                        </select>
                                    </div>

                                    <!-- Ngày bắt đầu -->
                                    <div class="col-md-6">
                                        <label for="ngayBatDau" class="form-label fw-bold">Ngày & Giờ Bắt Đầu <span class="text-danger">*</span></label>
                                        <input type="datetime-local" id="ngayBatDau" name="ngayBatDau" th:value="${campaign.ngayBatDau != null ? #temporals.format(campaign.ngayBatDau, 'yyyy-MM-dd') + 'T' + #temporals.format(campaign.ngayBatDau, 'HH:mm') : ''}" class="form-control" required>
                                    </div>

                                    <!-- Ngày kết thúc -->
                                    <div class="col-md-6">
                                        <label for="ngayKetThuc" class="form-label fw-bold">Ngày & Giờ Kết Thúc <span class="text-danger">*</span></label>
                                        <input type="datetime-local" id="ngayKetThuc" name="ngayKetThuc" th:value="${campaign.ngayKetThuc != null ? #temporals.format(campaign.ngayKetThuc, 'yyyy-MM-dd') + 'T' + #temporals.format(campaign.ngayKetThuc, 'HH:mm') : ''}" class="form-control" required>
                                    </div>

                                    <!-- Phần chọn sản phẩm -->
                                    <div class="col-12 mt-4">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <label class="form-label fw-bold mb-0">Áp Dụng Cho Sản Phẩm <span class="text-danger">*</span></label>
                                            <div class="fw-semibold text-brand">
                                                Đã chọn: <span id="selectedCount" class="badge bg-brand fs-6 text-white">0</span> / <span id="totalCount" th:text="${sanPhams.size()}">0</span> sản phẩm
                                            </div>
                                        </div>

                                        <!-- Tìm kiếm nhanh & Chọn tất cả -->
                                        <div class="row g-3 mb-3 align-items-center">
                                            <div class="col-md-6 search-box">
                                                <i class="fas fa-search"></i>
                                                <input type="text" id="productSearch" class="form-control" placeholder="Tìm kiếm nhanh theo tên sản phẩm...">
                                            </div>
                                            <div class="col-md-6 text-md-end">
                                                <div class="form-check form-check-inline">
                                                    <input class="form-check-input border-dark" type="checkbox" id="selectAllProducts">
                                                    <label class="form-check-label fw-bold text-dark" for="selectAllProducts">Chọn Tất Cả Sản Phẩm</label>
                                                </div>
                                            </div>
                                        </div>

                                        <!-- Danh sách sản phẩm dạng bảng cuộn dọc -->
                                        <div class="product-list-container">
                                            <table class="table table-hover align-middle mb-0" id="productTable">
                                                <thead class="table-dark sticky-top">
                                                    <tr>
                                                        <th style="width: 50px;" class="text-center">Chọn</th>
                                                        <th style="width: 80px;">ID</th>
                                                        <th>Tên Sản Phẩm</th>
                                                        <th>Danh Mục</th>
                                                        <th>Thương Hiệu</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr th:each="sp : ${sanPhams}" class="product-row">
                                                        <td class="text-center">
                                                            <input class="form-check-input product-checkbox border-secondary" type="checkbox" name="productIds" th:value="${sp.id}" th:checked="${selectedProductIds != null && selectedProductIds.contains(sp.id)}">
                                                        </td>
                                                        <td class="fw-bold text-dark" th:text="'#' + ${sp.id}">#1</td>
                                                        <td class="fw-semibold text-primary product-name" th:text="${sp.tenSanPham}">Racket A</td>
                                                        <td th:text="${sp.danhMuc.tenDanhMuc}">Vợt</td>
                                                        <td th:text="${sp.thuongHieu.tenThuongHieu}">Yonex</td>
                                                    </tr>
                                                    <tr th:if="${sanPhams.isEmpty()}">
                                                        <td colspan="5" class="text-center text-muted py-4">Không có sản phẩm nào đang bán.</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div class="col-12 mt-5 border-top pt-4 d-flex justify-content-end gap-2">
                                        <a th:href="@{/admin/khuyen-mai}" class="btn btn-secondary"><i class="fas fa-times me-1"></i> Hủy bỏ</a>
                                        <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Lưu Thay Đổi</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('productSearch');
    const selectAllCheckbox = document.getElementById('selectAllProducts');
    const productCheckboxes = document.querySelectorAll('.product-checkbox');
    const selectedCountSpan = document.getElementById('selectedCount');
    const productRows = document.querySelectorAll('.product-row');

    // Function to update the selected counter
    function updateCounter() {
        const checkedCount = document.querySelectorAll('.product-checkbox:checked').length;
        selectedCountSpan.textContent = checkedCount;
        
        // Update Select All state
        const visibleCheckedCount = Array.from(productCheckboxes).filter(cb => {
            const row = cb.closest('.product-row');
            return cb.checked && row.style.display !== 'none';
        }).length;
        
        const visibleCount = Array.from(productRows).filter(row => row.style.display !== 'none').length;
        selectAllCheckbox.checked = visibleCount > 0 && visibleCheckedCount === visibleCount;
    }

    // Initialize counter
    updateCounter();

    // Event listener for checkbox changes
    productCheckboxes.forEach(cb => {
        cb.addEventListener('change', updateCounter);
    });

    // Live search filter
    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        
        productRows.forEach(row => {
            const productName = row.querySelector('.product-name').textContent.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            if (productName.includes(query)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
        
        updateCounter();
    });

    // Select All functionality (Only checks visible products)
    selectAllCheckbox.addEventListener('change', function() {
        const isChecked = this.checked;
        productRows.forEach(row => {
            if (row.style.display !== 'none') {
                const cb = row.querySelector('.product-checkbox');
                if (cb) cb.checked = isChecked;
            }
        });
        updateCounter();
    });

    // Form validation before submit
    document.getElementById('campaignForm').addEventListener('submit', function(e) {
        const tenChienDich = document.getElementById('tenChienDich').value.trim();
        const phanTramGiam = parseInt(document.getElementById('phanTramGiam').value);
        const ngayBatDauStr = document.getElementById('ngayBatDau').value;
        const ngayKetThucStr = document.getElementById('ngayKetThuc').value;
        const checkedCount = document.querySelectorAll('.product-checkbox:checked').length;

        if (tenChienDich.length < 2 || tenChienDich.length > 100) {
            e.preventDefault();
            alert('Tên chiến dịch phải có độ dài từ 2 đến 100 ký tự!');
            document.getElementById('tenChienDich').focus();
            return;
        }

        if (isNaN(phanTramGiam) || phanTramGiam < 1 || phanTramGiam > 100) {
            e.preventDefault();
            alert('Phần trăm giảm giá phải nằm trong khoảng từ 1% đến 100%!');
            document.getElementById('phanTramGiam').focus();
            return;
        }

        if (!ngayBatDauStr || !ngayKetThucStr) {
            e.preventDefault();
            alert('Vui lòng chọn đầy đủ thời gian bắt đầu và kết thúc!');
            return;
        }

        const ngayBatDau = new Date(ngayBatDauStr);
        const ngayKetThuc = new Date(ngayKetThucStr);
        if (ngayBatDau >= ngayKetThuc) {
            e.preventDefault();
            alert('Ngày bắt đầu phải xảy ra trước ngày kết thúc!');
            document.getElementById('ngayBatDau').focus();
            return;
        }

        if (checkedCount === 0) {
            e.preventDefault();
            alert('Vui lòng chọn ít nhất một sản phẩm để áp dụng đợt giảm giá!');
            return;
        }
    });
});
</script>
</body>
</html>
