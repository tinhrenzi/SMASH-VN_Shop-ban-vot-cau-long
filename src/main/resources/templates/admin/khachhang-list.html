<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Khách Hàng - Admin SmashVN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar layout dùng chung -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('khachhang')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header layout dùng chung -->
            <div th:replace="~{admin/layout/header :: header}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title"><i class="fas fa-users text-brand me-2"></i>Quản Lý Khách Hàng</h2>
                <span class="badge bg-primary px-3 py-2" th:text="${danhSachKhachHang.size()} + ' Khách hàng'"></span>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-list me-2"></i>Danh Sách Khách Hàng Thành Viên</span>
                    <span class="badge bg-primary" th:text="${danhSachKhachHang.size()} + ' khách hàng'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive border-0 shadow-none">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Mã KH</th>
                                    <th>Họ Tên</th>
                                    <th>Email Tài Khoản</th>
                                    <th>Số Điện Thoại</th>
                                    <th>Nhận Bản Tin</th>
                                    <th>Trạng Thái</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="kh : ${danhSachKhachHang}">
                                    <td class="fw-bold text-dark" th:text="'KH' + ${kh.id}">KH1</td>
                                    <td class="fw-bold text-primary" th:text="${kh.hoKh} + ' ' + ${kh.tenKh}">John Doe</td>
                                    <td class="fw-semibold text-secondary" th:text="${kh.taiKhoan.email}">john@gmail.com</td>
                                    <td th:text="${kh.soDienThoaiKh != '' ? kh.soDienThoaiKh : 'Chưa cập nhật'}">0909090909</td>
                                    <td>
                                        <span th:if="${kh.nhanBanTin}" class="badge bg-success">Đồng ý</span>
                                        <span th:unless="${kh.nhanBanTin}" class="badge bg-secondary text-muted">Không</span>
                                    </td>
                                    <td>
                                        <span th:if="${kh.taiKhoan.trangThai == 'hoat_dong'}" class="badge bg-success">Hoạt động</span>
                                        <span th:unless="${kh.taiKhoan.trangThai == 'hoat_dong'}" class="badge bg-danger">Bị Khóa</span>
                                    </td>
                                </tr>
                                <tr th:if="${danhSachKhachHang.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted py-4">Chưa có khách hàng nào đăng ký hệ thống.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
