<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <header th:fragment="header" class="admin-topbar">
        <!-- CSRF Token Holder (CRITICAL BACKEND BINDING) -->
        <div id="csrf-token-holder" 
             th:data-csrf-token="${_csrf != null ? _csrf.token : ''}" 
             th:data-csrf-header="${_csrf != null ? _csrf.headerName : ''}" 
             style="display:none;"></div>

        <div class="admin-topbar-left">
            <!-- Mobile Hamburger Toggle Button -->
            <button class="admin-sidebar-toggle" id="adminSidebarToggle" type="button" title="Menu quản trị">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Global Search Bar (CRITICAL BINDING: id="adminGlobalSearch") -->
            <div class="admin-search-bar">
                <input type="text" id="adminGlobalSearch" placeholder="Tìm kiếm nhanh...">
                <button class="search-btn" type="button" onclick="executeSearch()"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <div class="admin-topbar-right">
            <!-- Return to Storefront Home Icon -->
            <a th:href="@{/}" class="nav-home-link" title="Trở về trang chủ">
                <i class="fas fa-home"></i>
            </a>

            <!-- User Profile & Sign Out Dropdown -->
            <div class="dropdown">
                <a href="javascript:void(0)" class="admin-user-dropdown dropdown-toggle" id="adminUserDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="far fa-user-circle user-avatar"></i>
                    <span class="admin-user-name d-none d-sm-inline" th:text="${session.tenHienThi != null ? session.tenHienThi : 'Quản trị'}">Admin</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="adminUserDropdown" style="border-radius: 12px; margin-top: 8px; min-width: 200px;">
                    <li class="dropdown-header text-uppercase fw-bold pb-2" style="font-size: 0.72rem; color: #888;">
                        <i class="fas fa-user-shield me-1"></i> <span th:text="${session.tenHienThi != null ? session.tenHienThi : 'Quản trị'}"></span>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item text-danger py-2" th:href="@{/admin/dang-xuat}">
                            <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Dynamic Admin Footer Relocation Placeholder -->
        <div class="admin-footer-placeholder" style="display: none;">
            <div class="container-fluid d-flex justify-content-between align-items-center py-3 flex-wrap gap-2 text-muted small border-top mt-4" style="border-color: #e5e7eb !important;">
                <span>© 2026 <strong>SmashVN Shop</strong> - Hệ thống quản lý bán vợt cầu lông</span>
                <span>Phiên bản 2.0 Admin Panel</span>
            </div>
        </div>

        <!-- Scroll to Top Button (CRITICAL BINDING: id="topScroll") -->
        <button id="topScroll" type="button" title="Cuộn lên đầu">
            <i class="fas fa-long-arrow-alt-up"></i>
        </button>
    </header>

</body>
</html>
