<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <nav th:fragment="sidebar(activeTab)" class="col-md-2 d-none d-md-block sidebar">
        <!-- Logo khu vực quản trị thiết kế theo style trang chủ -->
        <div class="sidebar-logo text-center py-3 mb-4 border-bottom border-secondary border-opacity-25">
            <a th:href="@{/admin/all}">
                <img th:src="@{/images/logo/logo-footer.png}" alt="SMASH VN Logo" style="max-height: 75px; display: block; margin: 0 auto 10px auto;">
            </a>
            <span class="text-xs text-uppercase tracking-widest text-muted" style="font-size: 0.75rem; letter-spacing: 0.15em; color: #adb5bd;">Khu Vực Admin</span>
        </div>
        
        <div class="sidebar-links d-flex flex-column gap-2">
            <a th:if="${session.vaiTro == 'QL'}" th:href="@{/admin/all}" th:class="${activeTab == 'tongquan' ? 'active' : ''}">
                <i class="fas fa-tachometer-alt me-2 text-brand"></i> Tổng Quan
            </a>

            <a th:if="${session.vaiTro == 'QL'}" th:href="@{/admin/thong-ke}" th:class="${activeTab == 'thongke' ? 'active' : ''}">
                <i class="fas fa-chart-line me-2 text-brand"></i> Thống Kê Doanh Thu
            </a>
            
            <a th:if="${session.vaiTro == 'QL'}" th:href="@{/admin/san-pham}" th:class="${activeTab == 'sanpham' ? 'active' : ''}">
                <i class="fas fa-box me-2 text-brand"></i> Sản Phẩm
            </a>

            <a th:if="${session.vaiTro == 'QL'}" th:href="@{/admin/danh-muc}" th:class="${activeTab == 'danhmuc' ? 'active' : ''}">
                <i class="fas fa-folder-open me-2 text-brand"></i> Danh Mục & Hãng
            </a>
            <a th:href="@{/admin/pos}" th:class="${activeTab == 'pos' ? 'active' : ''}">
                <i class="fas fa-cash-register me-2 text-brand"></i> Bán Tại Quầy (POS)
            </a>
            
            <a th:href="@{/admin/don-hang}" th:class="${activeTab == 'donhang' ? 'active' : ''}">
                <i class="fas fa-shopping-cart me-2 text-brand"></i> Đơn Hàng
            </a>
            

            
            <a th:href="@{/admin/khach-hang}" th:class="${activeTab == 'khachhang' ? 'active' : ''}">
                <i class="fas fa-users me-2 text-brand"></i> Khách Hàng
            </a>
            
            <a th:if="${session.vaiTro == 'QL'}" th:href="@{/admin/khuyen-mai}" th:class="${activeTab == 'khuyenmai' ? 'active' : ''}">
                <i class="fas fa-percent me-2 text-brand"></i> Khuyến Mãi
            </a>

            <a th:if="${session.vaiTro == 'QL'}" th:href="@{/admin/nhan-vien}" th:class="${activeTab == 'nhanvien' ? 'active' : ''}">
                <i class="fas fa-user-shield me-2 text-brand"></i> Nhân Viên
            </a>
            
            <a th:if="${session.vaiTro == 'QL'}" th:href="@{/admin/shipping-config}" th:class="${activeTab == 'shippingconfig' ? 'active' : ''}">
                <i class="fas fa-truck me-2 text-brand"></i> Cấu Hình GHN
            </a>
            
            <a th:href="@{/}" class="mt-5 text-warning logout-link">
                <i class="fas fa-arrow-left me-2"></i> Về Trang Chủ
            </a>
        </div>

        <style>
            .sidebar {
                position: sticky;
                top: 0;
                height: 100vh;
                overflow-y: auto;
                -ms-overflow-style: none;  /* IE and Edge */
                scrollbar-width: none;  /* Firefox */
                min-height: 100vh;
                background-color: #15171c !important; /* Deep dark slate from home page theme */
                color: #ffffff;
                padding-top: 10px;
                box-shadow: 4px 0 10px rgba(0,0,0,0.15);
                font-family: 'Open Sans', sans-serif;
                align-self: flex-start;
                z-index: 1000;
            }
            .sidebar::-webkit-scrollbar {
                display: none; /* Hide scrollbar for Chrome/Safari/Opera */
            }
            .sidebar a {
                color: #adb5bd;
                text-decoration: none;
                padding: 14px 20px;
                display: flex;
                align-items: center;
                border-radius: 8px;
                margin: 0 12px;
                font-weight: 600;
                font-size: 0.95rem;
                transition: all 0.25s ease;
            }
            .sidebar a i.text-brand {
                color: #adb5bd; /* Muted standard icon state */
                transition: all 0.25s ease;
            }
            .sidebar a:hover {
                background-color: #1e222b;
                color: #ffffff;
                transform: translateX(4px);
            }
            .sidebar a.active {
                background-color: #1e222b !important;
                color: #ff4500 !important; /* Premium brand orange-red highlight */
                border-left: 4px solid #ff4500 !important;
                box-shadow: inset 0 0 10px rgba(255, 69, 0, 0.05);
            }
            .sidebar a.active i.text-brand {
                color: #ff4500 !important;
            }
            .sidebar a.logout-link {
                border: 1px dashed rgba(255, 193, 7, 0.3);
                margin-top: 60px;
                color: #ffc107 !important;
            }
            .sidebar a.logout-link:hover {
                background-color: rgba(255, 193, 7, 0.1);
                color: #ffc107 !important;
                border-color: #ffc107;
            }
        </style>
    </nav>

</body>
</html>
