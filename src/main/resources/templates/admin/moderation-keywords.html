<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ Khóa Cấm Blog - Admin SmashVN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('moderationKeywords')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header -->
            <div th:replace="~{admin/layout/header :: header}"></div>

            <!-- Page Title Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <h2 class="page-title"><i class="fas fa-filter text-brand me-2"></i>Từ Khóa Cấm Blog</h2>
            </div>

            <!-- Toast / Alerts -->
            <div th:if="${successMsg != null}" class="alert alert-success alert-dismissible fade show border-start border-success border-4 rounded-3 shadow-sm mb-4" role="alert">
                <i class="fas fa-check-circle me-2"></i><span th:text="${successMsg}">Thành công</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMsg != null}" class="alert alert-danger alert-dismissible fade show border-start border-danger border-4 rounded-3 shadow-sm mb-4" role="alert">
                <i class="fas fa-times-circle me-2"></i><span th:text="${errorMsg}">Lỗi</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <!-- Add Keyword Form -->
                <div class="col-md-4 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-dark text-white">
                            <i class="fas fa-plus-circle me-1"></i> Thêm Từ Khóa Cấm Mới
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/moderation/keywords/add}" method="POST">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <div class="mb-3">
                                    <label for="keywordInput" class="form-label fw-semibold">Từ khóa / Cụm từ cấm</label>
                                    <input type="text" id="keywordInput" name="keyword" class="form-control" placeholder="Ví dụ: ditme, cặc..." required autocomplete="off">
                                    <div class="form-text text-muted">Hệ thống sẽ tự động chuẩn hóa chữ thường, bỏ dấu khi so sánh.</div>
                                </div>
                                <button type="submit" class="btn btn-brand text-white w-100"><i class="fas fa-save me-1"></i> Lưu Từ Khóa</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Keywords List Table -->
                <div class="col-md-8 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <span><i class="fas fa-list me-2"></i>Danh Sách Từ Khóa Cấm Hoạt Động</span>
                            <span class="badge bg-primary" th:text="${keywords.size()} + ' từ khóa'"></span>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive border-0 shadow-none">
                                <table class="table table-hover align-middle mb-0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Từ Khóa</th>
                                            <th>Trạng Thái</th>
                                            <th>Ngày Tạo</th>
                                            <th class="text-center">Hành Động</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="kw : ${keywords}">
                                            <td th:text="${kw.id}" class="fw-bold">1</td>
                                            <td class="fw-bold text-primary" th:text="${kw.keyword}">keyword</td>
                                            <td>
                                                <span th:if="${kw.active}" class="badge bg-success">Hoạt động</span>
                                                <span th:unless="${kw.active}" class="badge bg-secondary">Vô hiệu hóa</span>
                                            </td>
                                            <td th:text="${#temporals.format(kw.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-06-17 12:00:00</td>
                                            <td class="text-center">
                                                <div class="d-inline-flex gap-2">
                                                    <!-- Toggle Active Form -->
                                                    <form th:action="@{/admin/moderation/keywords/toggle/{id}(id=${kw.id})}" method="POST" class="d-inline">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <button type="submit" class="btn btn-sm btn-outline-warning" th:title="${kw.active ? 'Vô hiệu hóa' : 'Kích hoạt'}">
                                                            <i class="fas" th:classappend="${kw.active ? 'fa-ban' : 'fa-check'}"></i>
                                                        </button>
                                                    </form>
                                                    
                                                    <!-- Edit Button triggering Modal -->

                                                    <button type="button" class="btn btn-sm btn-outline-info edit-keyword-btn" 
                                                            th:data-id="${kw.id}" 
                                                            th:data-keyword="${kw.keyword}" 
                                                            title="Sửa từ khóa">

                                                    <button type="button" class="btn btn-sm btn-outline-info"
                                                            th:data-id="${kw.id}"
                                                            th:data-keyword="${kw.keyword}"
                                                            onclick="showEditModal(this)" title="Sửa từ khóa">

                                                        <i class="fas fa-edit"></i>
                                                    </button>

                                                    <!-- Delete Form -->
                                                    <form th:action="@{/admin/moderation/keywords/delete/{id}(id=${kw.id})}" method="POST" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa từ khóa này?')">
                                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </form>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr th:if="${#lists.isEmpty(keywords)}">
                                            <td colspan="5" class="text-center text-muted py-4">Chưa có từ khóa cấm nào được cấu hình.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editForm" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title" id="editModalLabel"><i class="fas fa-edit me-1"></i> Chỉnh Sửa Từ Khóa</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editKeywordInput" class="form-label fw-semibold">Từ khóa / Cụm từ cấm</label>
                        <input type="text" id="editKeywordInput" name="keyword" class="form-control" required autocomplete="off">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let editModal;
    document.addEventListener("DOMContentLoaded", function() {
        editModal = new bootstrap.Modal(document.getElementById('editModal'));
        
        // Bind click event to all edit buttons
        document.querySelectorAll('.edit-keyword-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                const keyword = this.getAttribute('data-keyword');
                showEditModal(id, keyword);
            });
        });
    });

    function showEditModal(btn) {
        var id = btn.getAttribute('data-id');
        var keyword = btn.getAttribute('data-keyword');
        document.getElementById('editKeywordInput').value = keyword;
        document.getElementById('editForm').action = '/admin/moderation/keywords/edit/' + id;
        editModal.show();
    }
</script>
</body>
</html>
