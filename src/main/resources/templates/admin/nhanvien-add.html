<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Nhân Viên Mới - Admin SmashVN</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/admin-custom.css}" rel="stylesheet">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar layout dùng chung -->
        <div th:replace="~{admin/layout/sidebar :: sidebar('nhanvien')}"></div>

        <!-- Main Content -->
        <main class="col-md-10 main-content">
            <!-- Header layout dùng chung -->
            <div th:replace="~{admin/layout/header :: header}"></div>

            <!-- Page Title Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title">
                    <a th:href="@{/admin/nhan-vien}" class="text-decoration-none text-brand me-1"><i class="fas fa-arrow-left"></i></a>
                    Thêm Nhân Viên Mới
                </h2>
            </div>

            <!-- Alert Lỗi nếu có -->
            <div th:if="${error != null or loi != null}" class="alert alert-danger alert-dismissible fade show border-start border-danger border-4 rounded-3 shadow-sm mb-4" role="alert">
                <i class="fas fa-times-circle me-2"></i><span th:text="${error != null ? error : loi}">Lỗi nhập liệu</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show border-start border-success border-4 rounded-3 shadow-sm mb-4" role="alert">
                <i class="fas fa-check-circle me-2"></i><span th:text="${success}">Thao tác thành công</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-dark text-white py-3">
                            <h5 class="fw-bold mb-0 text-white"><i class="fas fa-user-plus me-2 text-brand"></i>Nhập Thông Tin Tài Khoản Nhân Viên</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/admin/nhan-vien/them}" method="POST" class="row g-4">
                                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <!-- Email đăng nhập -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Đăng Nhập <span class="text-danger">*</span></label>
                                    <input type="email" id="email" name="email" th:value="${email}" class="form-control" placeholder="example@smash.vn" required>
                                    <div class="form-text text-muted">Email này sẽ dùng để đăng nhập hệ thống và phải là duy nhất.</div>
                                </div>

                                <!-- Mật khẩu -->
                                <div class="col-md-6">
                                    <label for="matKhau" class="form-label">Mật Khẩu <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="password" id="matKhau" name="matKhau" class="form-control" placeholder="Nhập mật khẩu ban đầu" required minlength="8" maxlength="50">
                                        <button class="btn btn-outline-secondary border" type="button" id="togglePassword"
                                                title="Giữ chuột để xem mật khẩu" style="cursor:pointer;">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                    <div class="form-text text-muted">Mật khẩu ban đầu phải dài từ 8 đến 50 ký tự.</div>
                                </div>

                                <!-- Họ và tên -->
                                <div class="col-md-6">
                                    <label for="hoTenNv" class="form-label">Họ và Tên Nhân Viên <span class="text-danger">*</span></label>
                                    <input type="text" id="hoTenNv" name="hoTenNv" th:value="${hoTenNv}" class="form-control" placeholder="Ví dụ: Nguyễn Văn A" required>
                                </div>

                                <!-- Số điện thoại -->
                                <div class="col-md-6">
                                    <label for="soDienThoaiNv" class="form-label">Số Điện Thoại <span class="text-danger">*</span></label>
                                    <input type="tel" id="soDienThoaiNv" name="soDienThoaiNv" th:value="${soDienThoaiNv}" class="form-control" placeholder="Ví dụ: 0912345678" required pattern="(03|05|07|08|09)[0-9]{8}" maxlength="10" title="Số điện thoại phải bắt đầu bằng 03, 05, 07, 08, 09 và đủ 10 số.">
                                </div>

                                <!-- Chức vụ -->
                                <div class="col-md-6">
                                    <label for="chucVu" class="form-label">Chức Vụ Cụ Thể <span class="text-danger">*</span></label>
                                    <input type="text" id="chucVu" name="chucVu" th:value="${chucVu}" class="form-control" placeholder="Ví dụ: Nhân viên bán hàng, Kế toán..." required>
                                </div>

                                <!-- Phân vai trò -->
                                <div class="col-md-6">
                                    <label for="vaiTro" class="form-label">Vai Trò Hệ Thống <span class="text-danger">*</span></label>
                                    <select id="vaiTro" name="vaiTro" class="form-select" required>
                                        <option value="NV" th:selected="${vaiTro == 'NV' || vaiTro == null}">Nhân viên</option>
                                        <option value="QL" th:selected="${vaiTro == 'QL'}">Quản trị viên</option>
                                    </select>
                                    <div class="form-text text-muted">Chọn vai trò ban đầu cho tài khoản nhân viên mới.</div>
                                </div>

                                <div class="col-12 mt-5 border-top pt-4 d-flex justify-content-end gap-2">
                                    <a th:href="@{/admin/nhan-vien}" class="btn btn-secondary"><i class="fas fa-times me-1"></i> Hủy bỏ</a>
                                    <button type="submit" class="btn btn-brand"><i class="fas fa-save me-1"></i> Lưu Thông Tin</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Show Password — hold to show, release to hide
    (function() {
        const btn = document.getElementById('togglePassword');
        const inp = document.getElementById('matKhau');
        const icon = btn.querySelector('i');

        function showPass(e) {
            if (e.type === 'mousedown') e.preventDefault();
            inp.type = 'text';
            icon.classList.remove('fa-eye'); icon.classList.add('fa-eye-slash');
        }
        function hidePass() {
            inp.type = 'password';
            icon.classList.remove('fa-eye-slash'); icon.classList.add('fa-eye');
        }

        btn.addEventListener('mousedown', showPass);
        btn.addEventListener('mouseup', hidePass);
        btn.addEventListener('mouseleave', hidePass);
        btn.addEventListener('touchstart', showPass);
        btn.addEventListener('touchend', hidePass);
    })();
</script>
</body>
</html>
