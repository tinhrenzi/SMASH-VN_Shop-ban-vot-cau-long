            <img class="preloader__img" th:src="@{/images/preloader.png}" alt=""></div>

    <!--====== Ứng dụng chính ======-->

        <!--====== Tiêu đề chính ======-->
	    <header class="header--style-1">
		    <div th:replace="~{layout/header :: header}"></div>
		</header>
        <!--====== End - Main Header ======-->


        <!--====== App Content ======-->
        <div class="app-content">

            <!--====== Section 1 ======-->
            <div class="u-s-p-y-60">

                <!--====== Section Content ======-->
                <div class="section__content">
                    <div class="container">
                        <div class="breadcrumb">
                            <div class="breadcrumb__wrap">
                                <ul class="breadcrumb__list">
                                    <li class="has-separator">

                                        <a th:href="@{/}">Home</a></li>
                                    <li class="is-marked">

                                        <a th:href="@{/signup.html}">Signup</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--====== End - Section 1 ======-->


            <!--====== Section 2 ======-->
            <div class="u-s-p-b-60">

                <!--====== Section Intro ======-->
                <div class="section__intro u-s-m-b-60">
                    <div class="container">
                        <div class="row">
                            <div class="col-lg-12">
                                <div class="section__text-wrap">
                                    <h1 class="section__heading u-c-secondary">Tạo mới tài khoản</h1>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--====== End - Section Intro ======-->


                <!--====== Section Content ======-->
                <div class="section__content">
                    <div class="container">
                        <div class="row row--center">
                            <div class="col-lg-6 col-md-8 u-s-m-b-30">
                                <div class="l-f-o">
                                    <div class="l-f-o__pad-box">
                                    
                                    <h1 class="gl-h1">THÔNG TIN CÁ NHÂN</h1>
                       
                                            <div class="gl-s-api">
                                            
											    <div class="u-s-m-b-15">
											    
											        <a th:href="@{/oauth2/authorization/google}" class="gl-s-api__btn gl-s-api__btn--gplus" style="display: flex; justify-content: center; align-items: center; gap: 10px;">
											            
											            <i class="fab fa-google"></i>
											            
											            <span>Đăng ký bằng Google</span>
											        
											        </a>
											    </div>
											</div>
                                            
                                        
                                        <div th:if="${loi != null}" class="u-s-m-b-15">
										    <span style="color: #ff0000; font-weight: bold;" th:text="${loi}"></span>
										</div>
										
										<form class="l-f-o__form" th:action="@{/user/dang-ky}" method="post">
										    
										    <div class="u-s-m-b-30">
										        <label class="gl-label" for="reg-email">E-MAIL *</label>
										        <input class="input-text input-text--primary-style" type="email" id="reg-email" name="email" required placeholder="Nhập E-mail của bạn" maxlength="100" style="border: 2px solid #ccc;">
										    </div>
										    
										    <div class="u-s-m-b-30">
										        <label class="gl-label" for="reg-password">MẬT KHẨU *</label>
										        <div style="position:relative;display:flex;align-items:center;">
										            <input class="input-text input-text--primary-style" type="password" id="reg-password" name="matKhau" required placeholder="Nhập mật khẩu" maxlength="30" style="border: 2px solid #ccc;padding-right:40px;width:100%;">
										            <button type="button" id="toggleRegPassword"
										                    title="Giữ chuột để xem mật khẩu"
										                    style="position:absolute;right:8px;background:none;border:none;cursor:pointer;color:#888;font-size:16px;padding:4px;line-height:1;"
										                    aria-label="Xem mật khẩu">
										                <i class="fas fa-eye" id="iconRegPassword"></i>
										            </button>
										        </div>
										    </div>
										
										    <div class="u-s-m-b-30">
										        <label class="gl-label" for="reg-password-confirm">XÁC NHẬN MẬT KHẨU *</label>
										        <div style="position:relative;display:flex;align-items:center;">
										            <input class="input-text input-text--primary-style" type="password" id="reg-password-confirm" name="xacNhanMatKhau" required placeholder="Nhập lại mật khẩu" maxlength="30" style="border: 2px solid #ccc;padding-right:40px;width:100%;">
										            <button type="button" id="toggleRegPasswordConfirm"
										                    title="Giữ chuột để xem mật khẩu"
										                    style="position:absolute;right:8px;background:none;border:none;cursor:pointer;color:#888;font-size:16px;padding:4px;line-height:1;"
										                    aria-label="Xem mật khẩu">
										                <i class="fas fa-eye" id="iconRegPasswordConfirm"></i>
										            </button>
										        </div>
										    </div>
										    
										    <div class="u-s-m-b-15">
										        <button class="btn btn--e-transparent-brand-b-2" type="submit">ĐĂNG KÝ</button>
										    </div>
										
										    <a class="gl-link" th:href="@{/}">Trở về Trang chủ</a>
										</form>
                                    </div>

            <!--====== End - Section 2 ======-->

    <!--====== Khi không hỗ trợ JavaScript ======-->
    <noscript>
        <div class="app-setting">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="app-setting__wrap">
                            <h1 class="app-setting__h1">JavaScript is disabled in your browser.</h1>

                            <span class="app-setting__text">Please enable JavaScript in your browser or upgrade to a JavaScript-capable browser.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </noscript>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.querySelector(".l-f-o__form");
            if (!form) return;
            const emailInput = document.getElementById("reg-email");
            const passwordInput = document.getElementById("reg-password");
            const confirmInput = document.getElementById("reg-password-confirm");
            const submitBtn = form.querySelector("button[type='submit']");

            function createErrorElement(inputEl, id) {
                let errEl = document.getElementById(id);
                if (!errEl) {
                    errEl = document.createElement("span");
                    errEl.id = id;
                    errEl.style.color = "#ff0000";
                    errEl.style.fontSize = "13px";
                    errEl.style.display = "none";
                    errEl.style.marginTop = "5px";
                    errEl.style.fontWeight = "bold";
                    inputEl.parentNode.appendChild(errEl);
                }
                return errEl;
            }

            const emailError = createErrorElement(emailInput, "email-error");
            const passwordError = createErrorElement(passwordInput, "password-error");
            const confirmError = createErrorElement(confirmInput, "confirm-error");

            const emailRegex = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,6}$/;
            const passwordRegex = /^(?=.*[A-Za-z])(?=.*\d)\S{8,30}$/;

            function validateEmail() {
                let value = emailInput.value;
                if (value.startsWith(" ") || value.endsWith(" ")) {
                    emailInput.value = value.trim();
                    value = emailInput.value;
                }
                
                if (!value) {
                    emailError.textContent = "Email không được để trống!";
                    emailError.style.display = "block";
                    return false;
                }
                if (value.length > 100) {
                    emailError.textContent = "Email không được vượt quá 100 ký tự!";
                    emailError.style.display = "block";
                    return false;
                }
                if (!emailRegex.test(value)) {
                    emailError.textContent = "Định dạng email không hợp lệ!";
                    emailError.style.display = "block";
                    return false;
                }
                emailError.style.display = "none";
                return true;
            }

            function validatePassword() {
                let value = passwordInput.value;
                if (/\s/.test(value)) {
                    passwordError.textContent = "Mật khẩu không được chứa khoảng trắng!";
                    passwordError.style.display = "block";
                    return false;
                }
                if (!value) {
                    passwordError.textContent = "Mật khẩu không được để trống!";
                    passwordError.style.display = "block";
                    return false;
                }
                if (value.length < 8 || value.length > 30) {
                    passwordError.textContent = "Mật khẩu phải dài từ 8 đến 30 ký tự!";
                    passwordError.style.display = "block";
                    return false;
                }
                if (!passwordRegex.test(value)) {
                    passwordError.textContent = "Mật khẩu phải chứa cả chữ và số!";
                    passwordError.style.display = "block";
                    return false;
                }
                passwordError.style.display = "none";
                return true;
            }

            function validateConfirmPassword() {
                const passVal = passwordInput.value;
                const confirmVal = confirmInput.value;
                if (!confirmVal) {
                    confirmError.textContent = "Vui lòng nhập lại mật khẩu!";
                    confirmError.style.display = "block";
                    return false;
                }
                if (passVal !== confirmVal) {
                    confirmError.textContent = "Mật khẩu xác nhận không trùng khớp!";
                    confirmError.style.display = "block";
                    return false;
                }
                confirmError.style.display = "none";
                return true;
            }

            emailInput.addEventListener("input", validateEmail);
            passwordInput.addEventListener("input", function() {
                validatePassword();
                if (confirmInput.value) {
                    validateConfirmPassword();
                }
            });
            confirmInput.addEventListener("input", validateConfirmPassword);

            form.addEventListener("submit", function (e) {
                const isEmailValid = validateEmail();
                const isPasswordValid = validatePassword();
                const isConfirmValid = validateConfirmPassword();

                if (!isEmailValid || !isPasswordValid || !isConfirmValid) {
                    e.preventDefault();
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang đăng ký...';
            });
        });
    </script>
    <script>
        // Password eye — hold to show, release to hide
        (function() {
            function bindToggle(btnId, inpId, iconId) {
                const btn  = document.getElementById(btnId);
                const inp  = document.getElementById(inpId);
                const icon = document.getElementById(iconId);
                if (!btn) return;
                function show(e) { if (e.type==='mousedown') e.preventDefault(); inp.type='text';     icon.className='fas fa-eye-slash'; }
                function hide()  { inp.type='password'; icon.className='fas fa-eye'; }
                btn.addEventListener('mousedown',  show);
                btn.addEventListener('mouseup',    hide);
                btn.addEventListener('mouseleave', hide);
                btn.addEventListener('touchstart', show);
                btn.addEventListener('touchend',   hide);
            }
            bindToggle('toggleRegPassword',        'reg-password',         'iconRegPassword');
            bindToggle('toggleRegPasswordConfirm', 'reg-password-confirm', 'iconRegPasswordConfirm');
        })();
    </script>
</body>
</html>
